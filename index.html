
<!DOCTYPE html>
<html>
<head>
<title>Online Doctor Consultation</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background: #eaf6f6;
  text-align: center;
}
header {
  background: #087f8c;
  color: white;
  padding: 20px;
}
.container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  margin: 40px;
}
.card {
  background: white;
  padding: 25px;
  width: 220px;
  border-radius: 10px;
  box-shadow: 0 2px 8px #aaa;
}
button {
  background: #087f8c;
  color: white;
  padding: 10px 20px;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}
</style>
</head>
<body>

<header>
<h1>Online Doctor Consultation</h1>
<p>Your Health, Our Priority</p>
</header>

<div class="container">

<div class="card">
<h2>Patient Module</h2>
<p>Register and search doctors online.</p>
<button onclick="show('Patient Module')">Explore</button>
</div>

<div class="card">
<h2>Doctor Module</h2>
<p>View doctor profiles and specialization.</p>
<button onclick="show('Doctor Module')">Explore</button>
</div>

<div class="card">
<h2>Appointment Module</h2>
<p>Book your online doctor appointment.</p>
<button onclick="show('Appointment Module')">Explore</button>
</div>

</div>

<script>
function show(module) {
  alert("Welcome to " + module);
}
</script>

</body>
</html>
